<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vann Express</title>
<style>
  :root { --utama:#e63946; --kuning:#ffb703; --gelap:#222; --abu:#f5f5f7; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,sans-serif; }
  body { background:var(--abu); color:var(--gelap); padding-bottom:90px; }
  button { cursor:pointer; font-size:15px; }

  header { background:var(--utama); padding:12px 14px; position:sticky; top:0; z-index:10; }
  .logo { color:#fff; font-size:20px; font-weight:800; margin-bottom:8px; }
  .cari { width:100%; padding:10px 14px; border:none; border-radius:22px; font-size:15px; }

  .banner { margin:12px; border-radius:16px; padding:20px; color:#fff;
    background:linear-gradient(135deg,#ff6b35,#e63946); display:flex; align-items:center; justify-content:space-between; }
  .banner h2 { font-size:22px; }
  .banner p { font-size:13px; margin-top:4px; opacity:.95; }
  .banner .emoji { font-size:60px; }

  .chips { display:flex; gap:8px; padding:4px 12px 12px; overflow-x:auto; }
  .chip { border:none; background:#fff; border-radius:22px; padding:8px 14px; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .chip.aktif { background:var(--gelap); color:#fff; }

  .menu { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; padding:0 12px; }
  .kartu { background:#fff; border-radius:16px; padding:14px; text-align:center; position:relative;
    box-shadow:0 1px 4px rgba(0,0,0,.08); display:flex; flex-direction:column; cursor:pointer; }
  .kartu .gambar { font-size:58px; }
  .kartu h3 { font-size:15px; margin:6px 0 2px; }
  .kartu small { color:#777; font-size:12px; flex:1; }
  .kartu .harga { font-weight:800; color:var(--utama); margin:8px 0; }
  .tag { position:absolute; top:10px; left:10px; background:var(--kuning); font-size:11px; font-weight:700; padding:3px 8px; border-radius:10px; }
  .kosongmsg { grid-column:1/-1; text-align:center; color:#888; padding:30px; }

  .btn { background:var(--utama); color:#fff; border:none; border-radius:12px; padding:11px; width:100%; font-weight:700; }
  .btn.hijau { background:#2a9d4a; }
  .btn.tutup { background:#aaa; margin-top:8px; }

  .bar { position:fixed; bottom:0; left:0; right:0; background:var(--gelap); color:#fff; padding:15px 16px;
    display:flex; justify-content:space-between; z-index:20; cursor:pointer; }
  .bar.sembunyi { display:none; }
  .bar b { color:var(--kuning); }

  .lapisan { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:30; }
  .lapisan.buka { display:flex; align-items:flex-end; justify-content:center; }
  .laci { background:#fff; width:100%; max-width:540px; max-height:90vh; overflow-y:auto; border-radius:22px 22px 0 0; padding:18px; }
  .laci h2 { margin-bottom:6px; }
  .laci h4 { margin:16px 0 6px; font-size:14px; }
  .detail { text-align:center; }
  .detail .besar { font-size:80px; }
  .detail p { color:#777; font-size:13px; }
  .opsi { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #eee; font-size:14px; margin:0; }
  .opsi span { margin-left:auto; color:#777; }
  .opsi input { width:auto; }
  .qtybar { display:flex; align-items:center; justify-content:center; gap:20px; margin:16px 0; font-size:20px; }
  .qtybar button { width:38px; height:38px; border-radius:50%; border:1px solid #ccc; background:#fff; font-size:20px; }
  .baris { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #eee; }
  .baris .info { flex:1; font-size:14px; }
  .baris small { display:block; color:#777; font-size:12px; }
  .baris .q { display:flex; align-items:center; gap:8px; }
  .baris .q button { width:28px; height:28px; border-radius:50%; border:1px solid #ccc; background:#fff; }
  .total { display:flex; justify-content:space-between; font-size:18px; font-weight:800; padding:14px 0; }
  .f label { display:block; font-size:13px; margin:12px 0 4px; }
  input[type=text], input[type=number], select { width:100%; padding:11px; border:1px solid #ccc; border-radius:10px; font-size:15px; }
  .struk { text-align:center; }
  .struk .nomor { font-size:34px; font-weight:800; color:var(--utama); margin:6px 0; }
</style>
</head>
<body>

<header>
  <div class="logo">🍔 Vann Express</div>
  <input class="cari" id="cari" placeholder="Cari menu..." oninput="cari=this.value;renderMenu()">
</header>

<div class="banner">
  <div><h2>Paket Hemat!</h2><p>Burger + kentang + minum<br>mulai Rp39.000</p></div>
  <div class="emoji">🍔</div>
</div>

<div class="chips" id="chips"></div>
<div class="menu" id="menu"></div>

<div class="bar sembunyi" id="bar" onclick="bukaKeranjang()">
  <span><span id="bJml">0</span> item</span>
  <span>Lihat pesanan • <b id="bTot">Rp0</b></span>
</div>

<div class="lapisan" id="lapisan" onclick="if(event.target===this)tutup()">
  <div class="laci" id="laci"></div>
</div>

<script>
// ===== DATA (edit di sini) =====
const KATEGORI = [
  {k:"Semua", i:"🍽️"}, {k:"Paket", i:"🎁"}, {k:"Burger", i:"🍔"},
  {k:"Pizza", i:"🍕"}, {k:"Ayam", i:"🍗"}, {k:"Minuman", i:"🥤"}, {k:"Dessert", i:"🍦"}
];
// Opsi ukuran & tambahan per kategori (t = tambahan harga)
const OPSI = {
  Paket:   { ukuran:null, extra:[{n:"Upgrade minuman Large",t:5000},{n:"Tambah saus",t:2000}] },
  Burger:  { ukuran:[{n:"Single",t:0},{n:"Double",t:12000}], extra:[{n:"Keju",t:4000},{n:"Telur",t:5000},{n:"Extra patty",t:10000}] },
  Pizza:   { ukuran:[{n:"Personal",t:0},{n:"Medium",t:25000},{n:"Large",t:45000}], extra:[{n:"Extra keju",t:8000},{n:"Pinggiran sosis",t:12000}] },
  Ayam:    { ukuran:[{n:"1 pcs",t:0},{n:"2 pcs",t:17000},{n:"3 pcs",t:32000}], extra:[{n:"Nasi",t:6000},{n:"Saus pedas",t:2000}] },
  Minuman: { ukuran:[{n:"Reguler",t:0},{n:"Large",t:4000}], extra:[{n:"Less sugar",t:0},{n:"Extra es",t:0}] },
  Dessert: { ukuran:null, extra:[{n:"Topping coklat",t:3000}] }
};
const MENU = [
  {id:1,  kat:"Paket",   nama:"Paket Hemat 1",   desk:"Cheese burger, kentang, es teh",    harga:39000, ikon:"🍱", tag:"Promo"},
  {id:2,  kat:"Paket",   nama:"Paket Berdua",    desk:"2 burger, 2 kentang, 2 cola",       harga:75000, ikon:"🎁", tag:"Hemat"},
  {id:3,  kat:"Burger",  nama:"Cheese Burger",   desk:"Daging sapi, keju leleh, selada",   harga:28000, ikon:"🍔", tag:"Terlaris"},
  {id:4,  kat:"Burger",  nama:"Chicken Burger",  desk:"Ayam crispy, saus mayo",            harga:26000, ikon:"🍔"},
  {id:5,  kat:"Pizza",   nama:"Pizza Pepperoni", desk:"Pepperoni sapi & mozzarella",       harga:49000, ikon:"🍕", tag:"Terlaris"},
  {id:6,  kat:"Pizza",   nama:"Pizza Margherita",desk:"Saus tomat & keju",                 harga:42000, ikon:"🍕"},
  {id:7,  kat:"Ayam",    nama:"Ayam Goreng",     desk:"Crispy, bumbu rahasia",             harga:20000, ikon:"🍗"},
  {id:8,  kat:"Ayam",    nama:"Chicken Wings",   desk:"Saus BBQ pedas manis",              harga:30000, ikon:"🍖"},
  {id:9,  kat:"Minuman", nama:"Es Teh Manis",    desk:"Segar",                             harga:8000,  ikon:"🧋"},
  {id:10, kat:"Minuman", nama:"Cola",            desk:"Dingin",                            harga:10000, ikon:"🥤"},
  {id:11, kat:"Dessert", nama:"Es Krim Vanila",  desk:"Lembut & manis",                    harga:12000, ikon:"🍦"},
  {id:12, kat:"Dessert", nama:"Sundae Coklat",   desk:"Es krim + saus coklat",             harga:16000, ikon:"🍨"}
];

// ===== STATE =====
let kat = "Semua", cari = "", keranjang = [], pilih = null;
const el = id => document.getElementById(id);
const rp = n => "Rp" + n.toLocaleString("id-ID");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ===== MENU =====
function renderChips() {
  el("chips").innerHTML = KATEGORI.map(c =>
    `<button class="chip ${c.k===kat?'aktif':''}" onclick="kat='${c.k}';renderChips();renderMenu()">${c.i} ${c.k}</button>`).join("");
}
function renderMenu() {
  const d = MENU.filter(m => (kat==="Semua"||m.kat===kat) && m.nama.toLowerCase().includes(cari.toLowerCase()));
  el("menu").innerHTML = d.length ? d.map(m => `
    <div class="kartu" onclick="bukaProduk(${m.id})">
      ${m.tag ? `<span class="tag">${m.tag}</span>` : ""}
      <div class="gambar">${m.ikon}</div>
      <h3>${m.nama}</h3><small>${m.desk}</small>
      <div class="harga">${rp(m.harga)}</div>
      <button class="btn">Pilih</button>
    </div>`).join("") : '<p class="kosongmsg">Menu tidak ditemukan.</p>';
}

// ===== DETAIL PRODUK =====
function bukaProduk(id) {
  pilih = { id, u:0, ex:[], cat:"", qty:1 };
  const m = MENU.find(x => x.id === id), o = OPSI[m.kat];
  el("laci").innerHTML = `
    <div class="detail"><div class="besar">${m.ikon}</div><h2>${m.nama}</h2><p>${m.desk}</p></div>
    ${o.ukuran ? "<h4>Pilih ukuran</h4>" + o.ukuran.map((u,i) => `
      <label class="opsi"><input type="radio" name="uk" ${i===0?"checked":""} onchange="pilih.u=${i};segar()"> ${u.n}
      <span>${u.t ? "+"+rp(u.t) : ""}</span></label>`).join("") : ""}
    <h4>Tambahan</h4>
    ${o.extra.map((x,i) => `
      <label class="opsi"><input type="checkbox" onchange="toggleEx(${i},this.checked)"> ${x.n}
      <span>${x.t ? "+"+rp(x.t) : "Gratis"}</span></label>`).join("")}
    <h4>Catatan</h4>
    <input type="text" placeholder="Contoh: tanpa bawang" oninput="pilih.cat=this.value">
    <div class="qtybar"><button onclick="ubahQ(-1)">−</button><b id="qTampil">1</b><button onclick="ubahQ(1)">+</button></div>
    <button class="btn" id="btnTambah" onclick="masukKeranjang()"></button>
    <button class="btn tutup" onclick="tutup()">Batal</button>`;
  segar();
  el("lapisan").classList.add("buka");
}
function satuan() {
  const m = MENU.find(x => x.id === pilih.id), o = OPSI[m.kat];
  return m.harga + (o.ukuran ? o.ukuran[pilih.u].t : 0) + pilih.ex.reduce((s,i) => s + o.extra[i].t, 0);
}
function segar() { el("btnTambah").textContent = "Tambah ke pesanan • " + rp(satuan() * pilih.qty); }
function toggleEx(i, on) { pilih.ex = on ? [...pilih.ex, i] : pilih.ex.filter(x => x !== i); segar(); }
function ubahQ(d) { pilih.qty = Math.max(1, pilih.qty + d); el("qTampil").textContent = pilih.qty; segar(); }

function masukKeranjang() {
  const m = MENU.find(x => x.id === pilih.id), o = OPSI[m.kat];
  const ukuran = o.ukuran ? o.ukuran[pilih.u].n : "";
  const extras = pilih.ex.map(i => o.extra[i].n);
  const key = [m.id, ukuran, extras.join(","), pilih.cat].join("|");
  const ada = keranjang.find(l => l.key === key);
  if (ada) ada.qty += pilih.qty;
  else keranjang.push({ key, nama:m.nama, ukuran, extras, cat:pilih.cat, satuan:satuan(), qty:pilih.qty });
  tutup(); updateBar();
}

// ===== KERANJANG =====
function total() { return keranjang.reduce((s,l) => ({ j:s.j+l.qty, t:s.t+l.qty*l.satuan }), { j:0, t:0 }); }
function updateBar() {
  const t = total();
  el("bJml").textContent = t.j; el("bTot").textContent = rp(t.t);
  el("bar").classList.toggle("sembunyi", t.j === 0);
}
function ubahLine(i, d) {
  keranjang[i].qty += d;
  if (keranjang[i].qty <= 0) keranjang.splice(i, 1);
  updateBar();
  keranjang.length ? bukaKeranjang() : tutup();
}
function bukaKeranjang() {
  const t = total();
  el("laci").innerHTML = `
    <h2>Pesanan kamu</h2>
    ${keranjang.map((l,i) => `
      <div class="baris">
        <div class="info"><b>${l.nama}</b>
          <small>${[l.ukuran, ...l.extras].filter(Boolean).join(", ")}${l.cat ? " • Catatan: "+esc(l.cat) : ""}</small>
          <small>${rp(l.satuan)}</small></div>
        <div class="q"><button onclick="ubahLine(${i},-1)">−</button><b>${l.qty}</b><button onclick="ubahLine(${i},1)">+</button></div>
      </div>`).join("")}
    <div class="total"><span>Total</span><span>${rp(t.t)}</span></div>
    <div class="f">
      <label>Nama pemesan</label><input type="text" id="inNama" placeholder="Nama kamu">
      <label>Tipe pesanan</label>
      <select id="inTipe" onchange="gantiTipe()">
        <option>Dine-in</option><option>Take away</option><option>Delivery</option>
      </select>
      <div id="bxMeja"><label>Nomor meja</label><input type="number" id="inMeja" min="1" placeholder="Contoh: 5"></div>
      <div id="bxAlamat" style="display:none"><label>Alamat</label><input type="text" id="inAlamat" placeholder="Alamat lengkap"></div>
      <label>Pembayaran</label>
      <select id="inBayar"><option>Tunai di kasir</option><option>QRIS</option><option>E-wallet</option></select>
    </div><br>
    <button class="btn hijau" onclick="checkout()">Pesan Sekarang</button>
    <button class="btn tutup" onclick="tutup()">Tambah menu lagi</button>`;
  el("lapisan").classList.add("buka");
}
function gantiTipe() {
  const t = el("inTipe").value;
  el("bxMeja").style.display = t === "Dine-in" ? "block" : "none";
  el("bxAlamat").style.display = t === "Delivery" ? "block" : "none";
}
function tutup() { el("lapisan").classList.remove("buka"); }

function checkout() {
  const nama = el("inNama").value.trim(), tipe = el("inTipe").value;
  const meja = el("inMeja").value, alamat = el("inAlamat").value.trim(), bayar = el("inBayar").value;
  if (!nama) return alert("Isi nama dulu ya.");
  if (tipe === "Dine-in" && !meja) return alert("Isi nomor meja dulu ya.");
  if (tipe === "Delivery" && !alamat) return alert("Isi alamat dulu ya.");
  const nomor = "A" + (Math.floor(Math.random()*900) + 100);
  const t = total();
  // Nanti di sini pesanan bisa dikirim ke server/database.
  el("laci").innerHTML = `
    <div class="struk">
      <div style="font-size:60px">✅</div>
      <h2>Pesanan diterima!</h2>
      <div class="nomor">${nomor}</div>
      <p>${esc(nama)} • ${tipe}${tipe==="Dine-in" ? " (meja "+esc(meja)+")" : ""}</p>
      <p style="margin:8px 0">${t.j} item • <b>${rp(t.t)}</b> • ${bayar}</p>
      <button class="btn" onclick="keranjang=[];updateBar();tutup()">Pesan Lagi</button>
    </div>`;
}

renderChips(); renderMenu();
</script>
</body>
</html>
